# Builds the two store releases from a bare-semver tag, with the tag as version name
# and the run number as build number:
#   - Android: .aab signed with the Play upload keystore (materialized from secrets;
#     see keystore.properties.example), kept as a workflow artifact and prepared as a
#     draft production release on Play via the Play API service account.
#   - iOS: signed with the Apple Distribution cert + "Paper Balloon App Store" profile, and
#     the embedded App Clip with "Paper Balloon Clip App Store" (project.yml pins manual
#     signing with exactly these), and uploaded straight to TestFlight via the ASC API
#     key (the TestFlight build IS the release candidate — no .ipa artifact). The
#     appstore job then readies that version for submission.
#
# A tag readies a release on both stores but submits neither: sending it to review
# stays a deliberate step, in Play Console and App Store Connect. What's New is the
# same short line every time, for both stores (store/play/whatsnew); edit it in the
# consoles when a release deserves more.
#
# Tags only, no manual runs: a change to this pipeline is tested by cutting a patch
# tag. Each store upload is the last step of its job, so a failed upload has used up
# no build number and "Re-run failed jobs" is the retry; a fix needs a new tag. Each
# signing step fails fast with a named error when its secrets are missing — the
# Android build would otherwise silently fall back to a debug-signed (store-rejected)
# artifact. The secrets live in the `release` environment, which admits only release
# tags, so a workflow pushed on any branch can't read them.
name: Release build

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  android:
    name: Android (AAB)
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # third_party/zxing-cpp is compiled from source by :app (see android/app/build.gradle.kts),
      # so the submodule has to be present or CMake configuration fails. Not recursive: zxing's
      # own zint submodule is unused.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Materialize the upload keystore from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # Play rejects a reused versionCode, so stamp a unique one. Both are -P
      # overrides — the static values in build.gradle.kts stay untouched. (Mirrors
      # the iOS Archive step below.)
      - name: Build signed release bundle
        working-directory: android
        run: ./gradlew bundleRelease "-PpbVersionCode=$GITHUB_RUN_NUMBER" "-PpbVersionName=$GITHUB_REF_NAME"

      # The Gradle script debug-signs release builds whenever keystore.properties is
      # unusable, so prove the upload key was picked up. An equality against the
      # keystore's own certificate, not a search for "Android Debug": that also passes
      # when keytool prints nothing at all.
      - name: Verify the release signature
        env:
          AAB: android/app/build/outputs/bundle/release/app-release.aab
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          want=$(keytool -exportcert -keystore "$RUNNER_TEMP/upload-keystore.jks" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -rfc |
            keytool -printcert | grep -m1 'SHA256:' | tr -d ' ')
          got=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | tr -d ' ')
          echo "keystore $want"
          echo "bundle   $got"
          if [ -z "$got" ] || [ "$want" != "$got" ]; then
            echo "::error::$AAB is not signed with the upload key"
            exit 1
          fi

      # Before publishing, so a Play-side rejection still leaves the bundle
      # downloadable from the run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: games.paperballoon.controller-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # mapping.txt goes with it or crash reports from this R8 build are unreadable. A
      # draft: rolling it out (which sends it to Google's review) is done in Play
      # Console. The service account needs "Release to production" on this app in Play
      # Console (Users and permissions, not Cloud IAM).
      - name: Prepare the Play production release (draft)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: games.paperballoon.controller
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          tracks: production
          status: draft
          whatsNewDirectory: store/play/whatsnew

  ios:
    name: iOS (TestFlight)
    environment: release
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select latest stable Xcode 27
        run: |
          # Real bundles only (the image's Xcode_27.2.app is a symlink to a beta), no
          # betas, newest by the bundle's own version (the RC folder name sorts badly).
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' ! -name '*beta*' \
            | while read -r x; do echo "$(defaults read "$x/Contents/Info" CFBundleShortVersionString) $x"; done \
            | sort -V | tail -1 | cut -d' ' -f2-)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Install xcodegen
        run: |
          # The runner image ships an untrusted aws/tap that brew warns about on
          # every invocation — drop it, we only need core.
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Import distribution certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_CLIP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_CLIP_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          # The upload's key too, so a missing one fails here and not after the archive.
          for v in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_CLIP_PROVISIONING_PROFILE_BASE64 \
                   ASC_API_KEY_P8_BASE64 ASC_API_KEY_ID ASC_API_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done

          # Throwaway keychain so nothing touches the runner's login keychain.
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the imported key without a UI prompt (headless runner).
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

          # One profile for the app, one for its embedded App Clip. Profiles must be
          # UUID-named; cover the classic dir and the Xcode 16+ one.
          for profile in "$IOS_PROVISIONING_PROFILE_BASE64" "$IOS_CLIP_PROVISIONING_PROFILE_BASE64"; do
            echo "$profile" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)"
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$UUID.mobileprovision"
            done
          done

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # ASC rejects reused build numbers, so stamp a unique one. Both are
      # xcodebuild-level overrides — project.yml's static values stay untouched.
      - name: Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -project PaperBalloon.xcodeproj \
            -scheme PaperBalloon \
            -destination "generic/platform=iOS" \
            -archivePath build/PaperBalloon.xcarchive \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" "MARKETING_VERSION=$GITHUB_REF_NAME"

      # Keep the debug symbols with the build — needed to symbolicate crash
      # reports for exactly this binary. Before the upload, which stays the job's
      # last step.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: games.paperballoon.controller-release-dsyms
          path: ios/build/PaperBalloon.xcarchive/dSYMs
          if-no-files-found: error

      # ExportOptions.plist has destination=upload, so "exporting" the archive
      # pushes the build to App Store Connect via the ASC API key.
      - name: Upload to TestFlight
        working-directory: ios
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild -exportArchive \
            -archivePath build/PaperBalloon.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

  # Turns the TestFlight upload into an App Store version ready to submit
  # (store/appclip/prepare_release.py). Its own job on a cheap runner, since it mostly
  # waits for Apple to process the build, and so "Re-run failed jobs" retries it alone
  # with the build number the upload used.
  appstore:
    name: App Store (prepare release)
    needs: ios
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare the App Store version
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/"AuthKey_$ASC_API_KEY_ID.p8"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt==2.10.1 cryptography==44.0.0 requests==2.32.3
          "$RUNNER_TEMP/venv/bin/python" store/appclip/prepare_release.py "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"

# Runs the two store-screenshot smoke tests (Android emulator + iOS simulator) and
# uploads the captured PNGs as artifacts. Doubles as the app's UI smoke check: each
# test asserts the catalog, sheets, code gating, and About content before capturing.
# Every UI test runs here, so this also runs the contract UI tests (ContractTest.kt,
# ContractTests.swift). The emulator's WebView predates Chromium 136, so on Android they
# check §4–5's legacy-WebView fallback, not the full path. §8's local-network wait has its
# own API 37 job (android-lan-gate). The iOS job also runs the scheme's unit tests
# (PaperBalloonTests); Android's run in checks.yml.
#
# The captures are for review. The stores' own images come from tools/store_screenshots.py
# on a dev machine: it needs a nearby room, both languages and the Duo's poses, none of
# which a runner has.
name: Store screenshots

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "third_party/**"
      - "tests/**"
      - ".github/workflows/store-screenshots.yml"
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "third_party/**"
      - "tests/**"
      - ".github/workflows/store-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # third_party/zxing-cpp is compiled from source by :app — see release-build.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Run screenshot UI test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2 # 1080×1920, the Play listing's size
          # Headroom: on the 2-core default a system window took focus mid-test
          # (Espresso's RootViewWithoutFocusException in pressBack).
          cores: 4
          ram-size: 4096M
          # SwANGLE, not the action's default swiftshader_indirect: since the design
          # language's home screen, that GL path deadlocks the emulator on the app's
          # first frame here (qemu idles, adb goes offline). It doesn't reproduce on
          # an Apple Silicon host, and no single home-screen effect is to blame.
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          # The action runs each line as its own `sh -c`: no multi-line constructs.
          script: |
            # Crash/ANR dialogs take window focus and land in screenshots; suppress them.
            adb shell settings put global hide_error_dialogs 1
            # That stops only later ones. The action's unlock key, sent as boot completes,
            # can already have hung a launcher with no window yet: close what is up.
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            # Streamed for the whole run: the device may be gone by the time a
            # failure is handled.
            mkdir -p ../diag
            adb logcat -v threadtime -b main,system,crash,events > ../diag/logcat.txt 2>&1 &
            # Status-bar demo mode is applied by the TEST itself (per theme pass —
            # the uimode flip knocks SystemUI out of demo mode, so a one-shot setup
            # here wouldn't stick). The test publishes PNGs to shared storage
            # (survives the post-test uninstall); clear leftovers so MediaStore
            # can't dedupe-rename.
            adb shell rm -rf /sdcard/Pictures/paperballoon-screenshots
            ./gradlew :app:connectedDebugAndroidTest || { adb shell dumpsys window > ../diag/window.txt 2>&1; exit 1; }
            adb pull /sdcard/Pictures/paperballoon-screenshots ../out
            ls -la ../out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: games.paperballoon.controller-screenshots-android
          path: out
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-test-reports
          path: |
            android/app/build/reports
            diag
          if-no-files-found: ignore

  # LocalNetworkGateTest needs API 37, the first to enforce the local-network permission,
  # and an app that starts with it ungranted. Revoking it kills the app, so the test can't do
  # that itself, and Gradle's connected task installs and instruments in one go, leaving no
  # point to revoke in between: install, revoke, then instrument that one class.
  android-lan-gate:
    name: Android local-network wait (API 37 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Run LocalNetworkGateTest
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "37.0" # quoted: as a number it would read as 37, and the SDK packages are android-37.0
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          # The action runs each line as its own `sh -c`: no multi-line constructs.
          script: |
            # Error dialogs and diagnostics as in the android job.
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            mkdir -p ../diag
            adb logcat -v threadtime -b main,system,crash,events > ../diag/logcat.txt 2>&1 &
            ./gradlew :app:installDebug :app:installDebugAndroidTest
            adb shell pm revoke games.paperballoon.controller android.permission.ACCESS_LOCAL_NETWORK
            adb shell pm clear-permission-flags games.paperballoon.controller android.permission.ACCESS_LOCAL_NETWORK user-set user-fixed
            adb shell am instrument -w -e class games.paperballoon.controller.LocalNetworkGateTest games.paperballoon.controller.test/androidx.test.runner.AndroidJUnitRunner | tee ../diag/instrument.txt
            # am instrument exits 0 on failure, and a skip also reads OK. Only the test's last answer grants the permission.
            adb shell dumpsys window > ../diag/window.txt 2>&1
            grep -q "^OK (1 test)" ../diag/instrument.txt
            adb shell dumpsys package games.paperballoon.controller | grep -q "ACCESS_LOCAL_NETWORK: granted=true"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-lan-gate-diagnostics
          path: diag
          if-no-files-found: ignore

  ios:
    name: iOS (simulator)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVICE: iPhone 17 Pro Max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select latest stable Xcode 27
        run: |
          # Real bundles only (the image's Xcode_27.2.app is a symlink to a beta), no
          # betas, newest by the bundle's own version (the RC folder name sorts badly).
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' ! -name '*beta*' \
            | while read -r x; do echo "$(defaults read "$x/Contents/Info" CFBundleShortVersionString) $x"; done \
            | sort -V | tail -1 | cut -d' ' -f2-)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Install xcodegen
        run: |
          # The runner image ships an untrusted aws/tap that brew warns about on
          # every invocation — drop it, we only need core.
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Boot simulator with a clean status bar
        run: |
          # Runner images pre-create only some device types.
          if ! xcrun simctl list devices available | grep -q "$DEVICE ("; then
            xcrun simctl create "$DEVICE" "$DEVICE"
          fi
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --operatorName " " --wifiBars 3
          # A fresh simulator shows first-use keyboard tutorials (QuickPath education
          # pane) over the typing screenshots — mark them as already seen.
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences KeyboardDidShowProductivityTutorial -bool true
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences DidShowGestureKeyboardIntroduction -bool true

      - name: Run unit + screenshot UI tests
        working-directory: ios
        run: |
          # retry-tests-on-failure absorbs simulator-infrastructure flakes
          # (kAXErrorIPCTimeout etc.) that hit cold, freshly-created simulators on
          # slow runners — the retry runs against a warmed-up simulator.
          xcodebuild test \
            -project PaperBalloon.xcodeproj \
            -scheme PaperBalloon \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

      - name: Export screenshots from the result bundle
        run: |
          xcrun xcresulttool export attachments --path ios/TestResults.xcresult --output-path out
          # Exported files are UUID-named; manifest.json carries the attachment names.
          # Keep only each test's last repetition — the one that passed; a retried
          # one's captures (and Xcode's automatic failure attachments) are dropped.
          python3 - <<'EOF'
          import json, os
          for test in json.load(open("out/manifest.json")):
              last = max(a.get("repetitionNumber", 1) for a in test["attachments"])
              for a in test["attachments"]:
                  path = os.path.join("out", a["exportedFileName"])
                  name = a["suggestedHumanReadableName"].split("_")[0]
                  if a.get("repetitionNumber", 1) == last and name[:2].isdigit():
                      os.rename(path, os.path.join("out", name + ".png"))
                  else:
                      os.remove(path)
          EOF
          rm out/manifest.json
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: games.paperballoon.controller-screenshots-ios
          path: out
          if-no-files-found: error

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          if-no-files-found: ignore

# Runs the two store-screenshot smoke tests (Android emulator + iOS simulator) and
# uploads the captured PNGs as artifacts. Doubles as the app's UI smoke check: each
# test asserts the catalog, sheets, code gating, and About content before capturing.
# The iOS jobs also run the scheme's unit tests (PaperBalloonTests); Android's run in
# checks.yml.
#
# Screenshot geometry is chosen for store requirements (phone-only by choice —
# the app isn't a good tablet experience, so no Play tablet sets):
#   - Android: pixel_2 = 1080×1920 (16:9) — within Play's 2:1 aspect limit.
#   - iOS: iPhone 17 Pro Max = 1320×2868 (App Store Connect's 6.9" display size)
#     and iPhone 14 Plus = 1284×2778 (the 6.5" slot — the only one ASC offered this
#     app record, so it gets a native capture rather than ASC auto-scaling). The app
#     is iPhone-only (TARGETED_DEVICE_FAMILY 1), so no iPad set is needed.
name: Store screenshots

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/store-screenshots.yml"
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/store-screenshots.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # third_party/zxing-cpp is compiled from source by :app — see release-build.yml.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run screenshot UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2 # 1080×1920 — Play-compliant 16:9 phone screenshots
          # Headroom: on the 2-core default a system window took focus mid-test
          # (Espresso's RootViewWithoutFocusException in pressBack).
          cores: 4
          ram-size: 4096M
          # SwANGLE, not the action's default swiftshader_indirect: since the design
          # language's home screen, that GL path deadlocks the emulator on the app's
          # first frame here (qemu idles, adb goes offline). It doesn't reproduce on
          # an Apple Silicon host, and no single home-screen effect is to blame.
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          # The action runs each line as its own `sh -c`: no multi-line constructs.
          script: |
            # Crash/ANR dialogs take window focus and land in screenshots; suppress them.
            adb shell settings put global hide_error_dialogs 1
            # Streamed for the whole run: the device may be gone by the time a
            # failure is handled.
            mkdir -p ../diag
            adb logcat -v threadtime -b main,system,crash,events > ../diag/logcat.txt 2>&1 &
            # Status-bar demo mode is applied by the TEST itself (per theme pass —
            # the uimode flip knocks SystemUI out of demo mode, so a one-shot setup
            # here wouldn't stick). The test publishes PNGs to shared storage
            # (survives the post-test uninstall); clear leftovers so MediaStore
            # can't dedupe-rename.
            adb shell rm -rf /sdcard/Pictures/paperballoon-screenshots
            ./gradlew :app:connectedDebugAndroidTest || { adb shell dumpsys window > ../diag/window.txt 2>&1; exit 1; }
            adb pull /sdcard/Pictures/paperballoon-screenshots ../out
            ls -la ../out

      - uses: actions/upload-artifact@v7
        with:
          name: games.paperballoon.controller-screenshots-android
          path: out
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            android/app/build/reports
            diag
          if-no-files-found: ignore

  ios:
    name: iOS ${{ matrix.size }} (simulator)
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: 6.9-inch
            device: iPhone 17 Pro Max # 1320×2868
          - size: 6.5-inch
            device: iPhone 14 Plus # 1284×2778
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode 27
        run: |
          # Real bundles only (the image's Xcode_27.2.app is a symlink to a beta), no
          # betas, newest by the bundle's own version (the RC folder name sorts badly).
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' ! -name '*beta*' \
            | while read -r x; do echo "$(defaults read "$x/Contents/Info" CFBundleShortVersionString) $x"; done \
            | sort -V | tail -1 | cut -d' ' -f2-)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Install xcodegen
        run: |
          # The runner image ships an untrusted aws/tap that brew warns about on
          # every invocation — drop it, we only need core.
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Boot simulator with a clean status bar
        run: |
          # Runner images only pre-create current-generation simulators — older
          # device types (iPhone 14 Plus) must be created first.
          if ! xcrun simctl list devices available | grep -q "$DEVICE ("; then
            xcrun simctl create "$DEVICE" "$DEVICE"
          fi
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --operatorName " " --wifiBars 3
          # A fresh simulator shows first-use keyboard tutorials (QuickPath education
          # pane) over the typing screenshots — mark them as already seen.
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences KeyboardDidShowProductivityTutorial -bool true
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences DidShowGestureKeyboardIntroduction -bool true

      - name: Run unit + screenshot UI tests
        working-directory: ios
        run: |
          # retry-tests-on-failure absorbs simulator-infrastructure flakes
          # (kAXErrorIPCTimeout etc.) that hit cold, freshly-created simulators on
          # slow runners — the retry runs against a warmed-up simulator.
          xcodebuild test \
            -project PaperBalloon.xcodeproj \
            -scheme PaperBalloon \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

      - name: Export screenshots from the result bundle
        run: |
          xcrun xcresulttool export attachments --path ios/TestResults.xcresult --output-path out
          # Exported files are UUID-named; manifest.json carries the attachment names.
          # Keep only each test's last repetition — the one that passed; a retried
          # one's captures (and Xcode's automatic failure attachments) are dropped.
          python3 - <<'EOF'
          import json, os
          for test in json.load(open("out/manifest.json")):
              last = max(a.get("repetitionNumber", 1) for a in test["attachments"])
              for a in test["attachments"]:
                  path = os.path.join("out", a["exportedFileName"])
                  name = a["suggestedHumanReadableName"].split("_")[0]
                  if a.get("repetitionNumber", 1) == last and name[:2].isdigit():
                      os.rename(path, os.path.join("out", name + ".png"))
                  else:
                      os.remove(path)
          EOF
          rm out/manifest.json
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: games.paperballoon.controller-screenshots-ios-${{ matrix.size }}
          path: out
          if-no-files-found: error

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ matrix.size }}
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
